[project]
name = "download-satellite-maps"
version = "0.1.0"
description = "Download satellite canopy-height products clipped to ALS tile boundaries, stored on Hugging Face (canopyboard-storage/satellite/)."
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "huggingface_hub>=1.14",
    "hf_xet",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
download-satellite-maps = "download_satellite_maps.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
